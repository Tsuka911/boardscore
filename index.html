<title>ボドゲ得点計算</title>
<style>
  :root {
    --bg: #f7f2ea;
    --card: #ffffff;
    --ink: #2b2118;
    --sub: #8a7a6a;
    --line: #e8ddcd;
    --sushi: #c0392b;
    --sushi-soft: #fbeae7;
    --sheet: #2c6e9b;
    --sheet-soft: #e6f0f7;
    --shadow: 0 2px 10px rgba(80,60,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1614; --card: #262120; --ink: #f2e9df; --sub: #a2938a; --line: #3a3230;
      --sushi: #e05c4c; --sushi-soft: #3a2523;
      --sheet: #57a5d4; --sheet-soft: #22333f;
      --shadow: 0 2px 10px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
  }
  header { padding: 34px 20px 20px; text-align: center; }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .06em; }
  header p { margin: 6px 0 0; font-size: 13px; color: var(--sub); }
  .wrap { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 6px 18px 30px; }
  a.tile {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 16px; margin-bottom: 14px;
    text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
  }
  a.tile:active { transform: scale(.985); }
  .tile .ic {
    width: 54px; height: 54px; border-radius: 14px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .tile.sushi .ic { background: var(--sushi-soft); padding: 0; }
  .tile .ic img { width: 100%; height: 100%; display: block;
                  object-fit: cover; border-radius: 14px; }
  .tile.sheet .ic { background: var(--sheet-soft); }
  .tile .tx { flex: 1; min-width: 0; }
  .tile .tx .t { font-size: 17px; font-weight: 700; }
  .tile.sushi .tx .t { color: var(--sushi); }
  .tile.sheet .tx .t { color: var(--sheet); }
  .tile .tx .d { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.5; }
  .tile .arw { color: var(--sub); font-size: 20px; flex: 0 0 auto; }
  .note {
    font-size: 12px; color: var(--sub); line-height: 1.8;
    text-align: center; margin-top: 22px;
  }
</style>
</head>
